<style>
  :root {
    --bg: #0b0d14;
    --bg-glow: rgba(99, 102, 241, .18);
    --card: rgba(255, 255, 255, .05);
    --card-border: rgba(255, 255, 255, .08);
    --text: #eef0f6;
    --muted: #8b90a3;
    --accent-a: #7c5cff;
    --accent-b: #3b82f6;
    --live-a: #f43f5e;
    --live-b: #fb923c;
    --ok: #22c55e;
    --warn: #f59e0b;
    --err: #ef4444;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f5fa;
      --bg-glow: rgba(99, 102, 241, .14);
      --card: rgba(255, 255, 255, .75);
      --card-border: rgba(15, 23, 42, .08);
      --text: #111427;
      --muted: #5d6275;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, var(--bg-glow), transparent 60%), var(--bg);
    color: var(--text);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  header { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
  .brand svg { display: block; border-radius: 8px; box-shadow: 0 4px 14px rgba(124, 92, 255, .35); }
  .brand span { background: linear-gradient(90deg, var(--accent-a), var(--accent-b)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .conn { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); transition: background .3s; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
  .dot.err { background: var(--err); }

  main { flex: 1; width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; }

  .talk-wrap { position: relative; width: min(68vw, 280px); aspect-ratio: 1; display: grid; place-items: center; }
  .ring { position: absolute; inset: 0; border-radius: 50%; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); opacity: .18; transform: scale(1); transition: transform .08s linear, opacity .3s; }
  .ring.r2 { opacity: .1; }
  .live .ring { background: linear-gradient(135deg, var(--live-a), var(--live-b)); opacity: .28; }
  .live .ring.r2 { opacity: .14; }
  #talk {
    position: relative; width: 78%; aspect-ratio: 1; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 18px 50px -10px rgba(99, 102, 241, .65), inset 0 1px 0 rgba(255, 255, 255, .25);
    color: #fff; display: grid; place-items: center; touch-action: none;
    transition: transform .15s ease, box-shadow .3s, background .3s;
  }
  #talk svg { width: 34%; height: 34%; }
  /* The mic opening (the button pops, a glow swells and two rings ripple out) and closing (two rings fold back
     into the button, which settles with a small bounce). */
  .burst { position: absolute; inset: 11%; border-radius: 50%; border: 4px solid var(--live-a); opacity: 0; pointer-events: none; }
  .burst.glow { border: none; background: radial-gradient(circle, rgba(244, 63, 94, .45), transparent 70%); }
  .burst.open { animation: burst-open .75s cubic-bezier(.2, .8, .2, 1) backwards; }
  .burst.glow.open { animation: glow-open .6s ease-out backwards; }
  #burst2.open { animation-delay: .16s; border-width: 2px; }
  .burst.close { border-color: var(--accent-b); animation: burst-close .5s cubic-bezier(.6, 0, .9, .4) backwards; }
  #burst2.close { animation-delay: .12s; border-width: 2px; }
  .burst.glow.close { animation: none; }
  #talk.pop { animation: talk-pop .35s ease-out; }
  #talk.settle { animation: talk-pop .3s ease-out .55s; }
  @keyframes burst-open { from { transform: scale(1); opacity: .95; } to { transform: scale(1.6); opacity: 0; } }
  @keyframes glow-open { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.5); opacity: 0; } }
  @keyframes burst-close { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: .9; } }
  @keyframes talk-pop { 40% { transform: scale(1.07); } }
  .live #talk { background: linear-gradient(135deg, var(--live-a), var(--live-b)); transform: scale(.94); box-shadow: 0 10px 40px -8px rgba(244, 63, 94, .7), inset 0 1px 0 rgba(255,255,255,.25); }
  .stop-mode #talk { background: linear-gradient(135deg, #334155, #1e293b); box-shadow: 0 18px 50px -12px rgba(15, 23, 42, .7); }
  #stop-icon, .stop-mode #talk-icon { display: none; }
  .stop-mode #stop-icon { display: block; }
  #talk:disabled { filter: grayscale(.7) brightness(.8); }

  .hint { text-align: center; color: var(--muted); font-size: 15px; min-height: 1.45em; }
  .hint strong { color: var(--text); font-weight: 600; }

  .card { width: 100%; background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; padding: 16px 18px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .status { display: flex; gap: 12px; align-items: flex-start; min-height: 56px; }
  .status .sdot { flex: none; width: 10px; height: 10px; border-radius: 50%; margin-top: 7px; background: var(--muted); }
  .status .sdot.thinking, .status .sdot.listening { background: var(--accent-b); animation: pulse 1s ease-in-out infinite; }
  .status .sdot.done { background: var(--ok); }
  .status .sdot.warn, .status .sdot.question, .status .sdot.yolo { background: var(--warn); }
  .status .sdot.error { background: var(--err); }
  .status p { margin: 0; white-space: pre-line; word-break: break-word; }
  @keyframes pulse { 50% { opacity: .35; } }

  .options { display: grid; gap: 8px; margin-top: 12px; }
  .options:empty { display: none; }
  .options button, .btn {
    font: inherit; font-weight: 600; color: var(--text); background: var(--card); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 12px 14px; text-align: left; display: flex; gap: 12px; align-items: center; cursor: pointer;
  }
  .options button b { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); color: #fff; }
  .options button:active, .btn:active { transform: scale(.98); }
  #stop { display: none; justify-content: center; margin-top: 12px; width: 100%; color: var(--err); }
  .busy #stop { display: flex; }

  /* PIN screen */
  #pair { display: none; flex-direction: column; align-items: center; gap: 18px; text-align: center; width: 100%; max-width: 360px; }
  .pairing #pair { display: flex; }
  .pairing #remote { display: none; }
  #pair h1 { margin: 0; font-size: 24px; letter-spacing: -.02em; }
  #pair p { margin: 0; color: var(--muted); }
  #pin {
    width: 100%; font: 600 32px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .4em; text-align: center;
    padding: 16px 0 16px .4em; border-radius: 16px; border: 1px solid var(--card-border); background: var(--card); color: var(--text); outline: none;
    -webkit-user-select: text; user-select: text;
  }
  #pin:focus { border-color: var(--accent-a); box-shadow: 0 0 0 4px rgba(99, 102, 241, .25); }
  .primary { width: 100%; justify-content: center; color: #fff; border: none; background: linear-gradient(135deg, var(--accent-a), var(--accent-b)); padding: 15px; }
  .error-text { color: var(--err) !important; min-height: 1.45em; }
  #remote { display: contents; }
</style>
</head>

  <section id="pair">
    <h1>Pair with your PC</h1>
    <p>Enter the PIN from Settings → Phone on your PC (right-click the hand in the tray).</p>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••">
    <button class="btn primary" id="pair-btn">Connect</button>
    <p class="error-text" id="pair-error"></p>
  </section>

  <div id="remote">
    <div class="talk-wrap" id="talk-wrap">
      <div class="ring r2" id="ring2"></div>
      <div class="ring" id="ring1"></div>
      <div class="burst glow" id="glow"></div>
      <div class="burst" id="burst"></div>
      <div class="burst" id="burst2"></div>
      <button id="talk" aria-label="Hold to talk">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="talk-icon">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="17" x2="12" y2="22"></line>
        </svg>
        <svg viewBox="0 0 24 24" fill="currentColor" id="stop-icon"><rect x="6" y="6" width="12" height="12" rx="2.5"></rect></svg>
      </button>
    </div>
    <div class="hint" id="hint"><strong>Hold</strong> to talk, let go to send</div>

    <div class="card">
      <div class="status"><div class="sdot" id="sdot"></div><p id="stext">Waiting for your PC…</p></div>
      <div class="options" id="options"></div>
      <button class="btn" id="stop">Stop</button>
    </div>
  </div>
</main>

<script>
(() => {
  const RATE = 16000, PREROLL_S = 0.3, MAX_S = 60;
  // Answering a question hands-free ("Listen for my answer automatically" in Settings on the PC).
  const AUTO_WAIT_S = 8, END_SILENCE_S = 0.8, MIN_SPEECH_S = 0.09, CHIME_MS = 400;
  const $ = id => document.getElementById(id);
  const body = document.body;

  // ---- pairing -------------------------------------------------------------
  let pin = '';
  try { pin = localStorage.getItem('jev-pin') || ''; } catch {}
  const fromHash = new URLSearchParams(location.hash.slice(1)).get('pin');
  if (fromHash) {
    pin = fromHash;
    try { localStorage.setItem('jev-pin', pin); } catch {}
    history.replaceState(null, '', location.pathname);
  }
  if (!pin) { body.classList.add('pairing'); $('conn-text').textContent = 'Not paired'; }

  $('pair-btn').onclick = () => {
    const v = $('pin').value.replace(/\D/g, '');
    if (v.length !== 6) { $('pair-error').textContent = 'The PIN has 6 digits.'; return; }
    pin = v;
    try { localStorage.setItem('jev-pin', pin); } catch {}
    $('pair-error').textContent = '';
    body.classList.remove('pairing');
    poll();
  };
  $('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('pair-btn').click(); });

  async function api(path, opts = {}) {
    const res = await fetch(path, { method: 'POST', ...opts, headers: { 'X-Jev-Pin': pin, ...(opts.headers || {}) } });
    if (res.status === 401) { unpair('That PIN didn\'t work. Check Settings → Phone on your PC.'); throw new Error('pin'); }
    if (res.status === 429) { setConn(false, 'Locked'); throw new Error('Too many wrong PINs. Try again in a few minutes.'); }
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return res.json();
  }
  function unpair(msg) {
    pin = '';
    try { localStorage.removeItem('jev-pin'); } catch {}
    $('pair-error').textContent = msg;
    body.classList.add('pairing');
    $('conn-dot').className = 'dot';
    $('conn-text').textContent = 'Not paired';
  }

  // ---- status from the PC --------------------------------------------------
  let status = null, pollTimer = null;
  function setConn(ok, text) {
    $('conn-dot').className = 'dot ' + (ok ? 'ok' : 'err');
    $('conn-text').textContent = text;
  }
  async function poll() {
    clearTimeout(pollTimer);
    if (!pin) return;
    try {
      render(await api('/api/status', { method: 'GET' }));
      setConn(true, 'Connected');
    } catch (e) {
      if (e.message !== 'pin') setConn(false, navigator.onLine ? 'Can\'t reach your PC' : 'Offline');
    }
    pollTimer = setTimeout(poll, document.hidden ? 5000 : (status && status.busy ? 500 : 1500));
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });

  function render(s) {
    status = s;
    const idle = !s.busy && !s.listening && !s.question;
    let text = s.question || s.text;
    const name = s.name || 'Fing';
    if ($('brand-name').textContent !== name) { $('brand-name').textContent = name; document.title = name + ' remote'; }
    if (idle && (!text || /hold Right Ctrl/i.test(text))) text = s.ready ? 'Ready' : (s.text || name + ' isn\'t ready yet');
    $('stext').textContent = text;
    $('sdot').className = 'sdot ' + (s.question ? 'question' : s.state);
    body.classList.toggle('busy', s.busy && !s.question);
    body.classList.toggle('stop-mode', s.busy && !s.question && !recording);
    if (!recording) {
      $('hint').innerHTML = s.question ? '<strong>Tap</strong> an option, or <strong>hold</strong> and say it'
        : s.busy ? '<strong>Tap</strong> to stop' : '<strong>Hold</strong> to talk, let go to send';
    }
    maybeAutoListen(s);
    const opts = $('options');
    const key = JSON.stringify(s.options);
    if (opts.dataset.key !== key) {
      opts.dataset.key = key;
      opts.innerHTML = '';
      s.options.forEach((label, i) => {
        const b = document.createElement('button');
        b.innerHTML = `<b>${i + 1}</b><span></span>`;
        b.querySelector('span').textContent = label;
        b.onclick = () => { buzz(15); api('/api/answer', { body: JSON.stringify({ option: i + 1 }) }).then(render).catch(showError); };
        opts.appendChild(b);
      });
    }
  }
  $('stop').onclick = () => { buzz(30); api('/api/stop').then(render).catch(showError); };
  function showError(e) { if (e.message !== 'pin') $('hint').textContent = e.message; }

  // ---- microphone ----------------------------------------------------------
  let ctx = null, stream = null, chunks = [], preroll = [], prerollLen = 0, recording = false, recLen = 0, level = 0;
  let noise = 0.002; // background loudness, for telling when you've stopped talking
  let auto = null; // set while listening for an answer by itself: { began, speech, quiet } (seconds)
  let autoAsked = -1; // the question it last listened for, so each question gets one go
  const WORKLET = `class Tap extends AudioWorkletProcessor {
    process(inputs) { const ch = inputs[0] && inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
  }
  registerProcessor('tap', Tap);`;

  async function ensureMic() {
    if (ctx && stream && stream.active) { if (ctx.state !== 'running') await ctx.resume(); return; }
    if (!window.isSecureContext || !navigator.mediaDevices) throw new Error('Open this page with https:// to use the microphone.');
    stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })));
    const src = ctx.createMediaStreamSource(stream);
    const tap = new AudioWorkletNode(ctx, 'tap');
    const mute = ctx.createGain();
    mute.gain.value = 0;
    src.connect(tap).connect(mute).connect(ctx.destination);
    tap.port.onmessage = e => onAudio(e.data);
    if (ctx.state !== 'running') await ctx.resume();
  }

  function onAudio(buf) {
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    const rms = Math.sqrt(sum / buf.length);
    level = level * 0.6 + rms * 0.4;
    const speech = rms > Math.max(0.006, noise * 3);
    noise = Math.max(1e-4, noise + (rms - noise) * (speech ? 0.002 : 0.05));
    if (recording && auto && performance.now() - auto.began < CHIME_MS) return; // its own chime, not your answer
    if (recording && auto) {
      const t = buf.length / ctx.sampleRate;
      if (speech) { auto.speech += t; auto.quiet = 0; } else auto.quiet += t;
      if (auto.speech >= MIN_SPEECH_S && auto.quiet >= END_SILENCE_S) { auto = null; release(); }
      else if (auto.speech < MIN_SPEECH_S && (performance.now() - auto.began) / 1000 > AUTO_WAIT_S) stopAuto();
    }
    if (recording) {
      chunks.push(buf);
      recLen += buf.length;
      if (recLen > MAX_S * ctx.sampleRate) release();
    } else {
      // Keep the last fraction of a second so the first syllable isn't lost.
      preroll.push(buf);
      prerollLen += buf.length;
      while (prerollLen - preroll[0].length > PREROLL_S * ctx.sampleRate) prerollLen -= preroll.shift().length;
    }
  }

  function toPcm16(parts, fromRate) {
    let n = 0;
    for (const p of parts) n += p.length;
    const all = new Float32Array(n);
    let o = 0;
    for (const p of parts) { all.set(p, o); o += p.length; }
    const ratio = fromRate / RATE, outLen = Math.floor(n / ratio), out = new Int16Array(outLen);
    for (let i = 0; i < outLen; i++) {
      // Average the source samples this output sample covers (a simple low-pass before decimating).
      const a = Math.floor(i * ratio), b = Math.min(n, Math.max(a + 1, Math.floor((i + 1) * ratio)));
      let s = 0;
      for (let j = a; j < b; j++) s += all[j];
      const v = Math.max(-1, Math.min(1, s / (b - a)));
      out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    return out;
  }

  // ---- the talk button -----------------------------------------------------
  const talk = $('talk');
  let held = false, pressSent = null;

  function buzz(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch {} }

  // Every time the mic opens or closes, however it happened, the button plays the matching ring.
  function micRing(open) {
    for (const id of ['glow', 'burst', 'burst2']) {
      const b = $(id), base = id === 'glow' ? 'burst glow' : 'burst';
      b.className = base;
      void b.offsetWidth; // restart the animation
      b.className = base + (open ? ' open' : ' close');
    }
    talk.classList.remove('pop', 'settle');
    void talk.offsetWidth;
    talk.classList.add(open ? 'pop' : 'settle');
    chime(open ? [[0, 1046.5, .8], [.07, 1568, 1]] : [[0, 1568, .7], [.07, 1046.5, .6]]);
  }

  // The same soft two-note chimes as the PC (sounds.py): rising when the mic opens, falling when it closes.
  function chime(notes) {
    if (!ctx || ctx.state !== 'running') return;
    const t0 = ctx.currentTime + 0.01;
    for (const [at, freq, loud] of notes) {
      for (const [mult, part] of [[1, 1], [2, .25], [3, .08]]) {
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.frequency.value = freq * mult;
        gain.gain.setValueAtTime(0, t0 + at);
        gain.gain.linearRampToValueAtTime(0.12 * loud * part, t0 + at + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.4);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t0 + at);
        osc.stop(t0 + at + 0.42);
      }
    }
  }

  function micReady() { return !!(ctx && stream && stream.active && ctx.state === 'running'); }

  // A question for a command said on this phone, with auto-listen on: open the mic for the answer. Only while
  // the page is in front and the mic has been used since it loaded: browsers won't start it without a tap.
  function maybeAutoListen(s) {
    if (!s.auto_listen || s.question_id === autoAsked || recording || held || document.hidden || !micReady()) return;
    autoAsked = s.question_id;
    startAuto();
  }

  async function startAuto() {
    let r;
    try { r = await api('/api/press'); } catch (err) { showError(err); return; }
    if (r.result !== 'listening' || held || recording) { render(r); return; }
    chunks = preroll.slice();
    recLen = prerollLen;
    preroll = []; prerollLen = 0;
    recording = true;
    auto = { began: performance.now(), speech: 0, quiet: 0 };
    pressSent = Promise.resolve(true);
    body.classList.add('live');
    micRing(true);
    buzz(20);
    $('hint').innerHTML = '<strong>Listening…</strong> say your answer';
  }

  function stopAuto() {
    // Nobody spoke: close the mic and leave the question up for a tap.
    cancelRecording();
    api('/api/stop').then(render).catch(showError);
  }

  talk.addEventListener('pointerdown', async e => {
    e.preventDefault();
    if (held) return;
    held = true;
    try { talk.setPointerCapture(e.pointerId); } catch {}
    buzz(20);
    if (auto) { auto = null; return; } // already listening for the answer: now it's hold to talk, let go to send
    if (status && status.busy && !status.question) {
      api('/api/press').then(render).catch(showError); // a press while it's working stops it, like Right Ctrl
      return;
    }
    try {
      await ensureMic();
    } catch (err) {
      held = false;
      $('hint').textContent = err.name === 'NotAllowedError' ? 'Allow the microphone for this page, then try again.' : err.message;
      return;
    }
    if (!held) { $('hint').innerHTML = 'Microphone ready. <strong>Hold</strong> to talk'; return; } // let go while the mic was starting
    chunks = preroll.slice();
    recLen = prerollLen;
    preroll = []; prerollLen = 0;
    recording = true;
    body.classList.add('live');
    micRing(true);
    $('hint').innerHTML = '<strong>Listening…</strong> let go to send';
    pressSent = api('/api/press').then(r => {
      if (r.result !== 'listening') {
        cancelRecording();
        $('hint').textContent = r.result === 'busy' ? 'Someone is talking on the PC.' : r.result === 'stopped' ? 'Stopped.' : ((status && status.name) || 'Fing') + ' isn\'t ready.';
      }
      render(r);
      return r.result === 'listening';
    }).catch(err => { cancelRecording(); showError(err); return false; });
  });

  function cancelRecording() {
    if (recording) micRing(false);
    auto = null;
    recording = false;
    chunks = []; recLen = 0;
    body.classList.remove('live');
  }

  async function release() {
    if (!recording) return;
    const parts = chunks, rate = ctx.sampleRate;
    cancelRecording();
    buzz(10);
    $('hint').innerHTML = '<strong>Sending…</strong>';
    if (!(await pressSent)) return;
    try {
      const pcm = toPcm16(parts, rate);
      render(await api('/api/release', { body: pcm.buffer, headers: { 'Content-Type': 'application/octet-stream', 'X-Sample-Rate': String(RATE) } }));
      $('hint').innerHTML = '<strong>Sent</strong>';
      poll();
    } catch (err) {
      showError(err);
      api('/api/stop').catch(() => {});
    }
  }

  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    talk.addEventListener(ev, () => { if (!held) return; held = false; release(); });
  }
  talk.addEventListener('contextmenu', e => e.preventDefault());

  // ---- level rings ---------------------------------------------------------
  (function animate() {
    const l = recording ? Math.min(1, level * 9) : 0;
    $('ring1').style.transform = `scale(${1 + l * 0.12})`;
    $('ring2').style.transform = `scale(${1.08 + l * 0.28})`;
    requestAnimationFrame(animate);
  })();

  // Keep the screen on while the page is open, where the browser allows it.
  async function wake() { try { if ('wakeLock' in navigator && !document.hidden) await navigator.wakeLock.request('screen'); } catch {} }
  document.addEventListener('visibilitychange', wake);
  wake();

  poll();
})();
</script>
</body>
</html>
